<script>
  // dodatkowa ochrona: usuń token z URL jeśli przypadkowo się pojawił
  (function removeTokenFromUrl() {
    try {
      const url = new URL(window.location.href);
      if (url.searchParams.has("token") || url.searchParams.has("access_token")) {
        url.searchParams.delete("token");
        url.searchParams.delete("access_token");
        window.history.replaceState({}, document.title, url.pathname + url.search);
      }
    } catch (e) {}
  })();

  // pobierz usera (cookie HttpOnly wysyłane automatycznie)
  fetch("/api/user")
    .then(async r => {
      if (!r.ok) {
        const body = await r.json().catch(()=>({}));
        throw new Error(body.error || "Server error");
      }
      return r.json();
    })
    .then(data => {
      // renderuj usera
    })
    .catch(err => {
      console.error(err);
      // pokaż link do logowania: /api/login
    });
</script>

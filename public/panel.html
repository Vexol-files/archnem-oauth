<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Archnemesis — Panel</title>
  <style>
    :root{ --bg:#0b1220; --card:rgba(255,255,255,0.06); --text:#eaeaea; --accent:#d28cff; --muted:#9aa6b2; }
    [data-theme="light"]{ --bg:#f6f7fb; --card:rgba(10,10,12,0.04); --text:#0b1220; --accent:#6b21a8; --muted:#4b5563; }
    body{ margin:0; font-family:Inter,Segoe UI,Arial; background:linear-gradient(135deg,var(--bg),#0a0a0a); color:var(--text); padding:28px; }
    .container{ max-width:980px; margin:auto; }
    .header{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
    .btn{ background:var(--card); border-radius:8px; padding:8px 12px; color:var(--text); border:1px solid rgba(255,255,255,0.06); cursor:pointer; }
    .card{ background:var(--card); border-radius:12px; padding:16px; }
    .avatar{ width:88px; height:88px; border-radius:50%; object-fit:cover; border:3px solid var(--accent); }
    .roles{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .role{ padding:6px 10px; border-radius:999px; background:rgba(255,255,255,0.12); color:#071022; font-weight:600; }
    .error{ color:#ff6b6b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1 style="margin:0;color:var(--accent)">Archnemesis</h1>
        <div style="color:var(--muted)">Panel użytkownika</div>
      </div>
      <div>
        <button class="btn" id="logout">Wyloguj</button>
      </div>
    </div>

    <div class="card">
      <div id="status">Ładowanie danych...</div>

      <div id="userArea" style="display:none;">
        <div style="display:flex;gap:16px;align-items:center;margin-top:12px;">
          <img id="avatar" class="avatar" src="" alt="avatar">
          <div>
            <div id="username" style="font-weight:700;font-size:18px"></div>
            <div id="user-sub" style="color:var(--muted)"></div>
          </div>
        </div>

        <div style="margin-top:12px;color:var(--muted)">Twoje rangi:</div>
        <div class="roles" id="roles"></div>
      </div>

      <div id="errorBox" class="error" style="display:none;margin-top:12px;"></div>
    </div>
  </div>

  <script>
    // Usuń token z URL jeśli przypadkowo się pojawił (dodatkowa ochrona)
    (function removeTokenFromUrl() {
      try {
        const url = new URL(window.location.href);
        if (url.searchParams.has("access_token")) {
          url.searchParams.delete("access_token");
          window.history.replaceState({}, document.title, url.pathname + url.search);
        }
      } catch (e) { /* ignore */ }
    })();

    document.getElementById("logout").addEventListener("click", () => {
      // wyczyść ewentualne sessionStorage i wywołaj backend logout
      try { sessionStorage.removeItem("archnem_token"); } catch(e) {}
      window.location.href = "/api/logout";
    });

    // Pobierz dane użytkownika z backendu (cookie HttpOnly wysyłane automatycznie)
    fetch("/api/user")
      .then(async r => {
        if (!r.ok) {
          const body = await r.json().catch(()=>({}));
          throw new Error(body.error || "Server error");
        }
        return r.json();
      })
      .then(data => {
        document.getElementById("userArea").style.display = "block";
        document.getElementById("status").textContent = `Zalogowany jako ${data.username}#${data.discriminator}`;

        const avatarEl = document.getElementById("avatar");
        if (data.avatar) {
          avatarEl.src = `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png?size=256`;
        } else {
          avatarEl.src = `https://cdn.discordapp.com/embed/avatars/${parseInt(data.discriminator) % 5}.png`;
        }

        document.getElementById("username").textContent = `${data.username}#${data.discriminator}`;

        const rolesEl = document.getElementById("roles");
        rolesEl.innerHTML = "";
        const roleIds = Array.isArray(data.roles) ? data.roles : [];
        if (!roleIds.length) {
          rolesEl.innerHTML = `<div style="color:var(--muted)">Brak ról</div>`;
          return;
        }
        roleIds.forEach(rid => {
          const el = document.createElement("div");
          el.className = "role";
          el.textContent = rid;
          rolesEl.appendChild(el);
        });
      })
      .catch(err => {
        console.error(err);
        document.getElementById("status").textContent = "Brak sesji. Zaloguj się przez Discord.";
        const eb = document.getElementById("errorBox");
        eb.style.display = "block";
        eb.textContent = err.message || "Błąd sieci";
      });
  </script>
</body>
</html>

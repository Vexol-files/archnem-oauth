<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Archnemesis — Panel</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0a0a0a, #1a001f, #0a0a0a);
      background-size: 300% 300%;
      animation: bgMove 12s ease infinite;
      color: #eaeaea;
      padding: 40px;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.25);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(18px);
      box-shadow: 0 0 35px rgba(127,0,255,0.3);
      margin-bottom: 25px;
    }

    .title {
      font-size: 45px;
      margin: 0 0 20px 0;
      color: #d28cff;
      text-shadow: 0 0 20px #7f00ff;
      text-align: center;
    }

    .user-box {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #7f00ff;
      box-shadow: 0 0 20px #7f00ff;
    }

    .username {
      font-size: 28px;
      font-weight: bold;
      color: #eaeaea;
    }

    .roles-title {
      font-size: 26px;
      margin-top: 20px;
      color: #d28cff;
      text-shadow: 0 0 15px #7f00ff;
    }

    .role {
      display: inline-block;
      margin: 6px 8px;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 16px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(10px);
    }

    .error {
      color: #ffb4b4;
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1 class="title">Panel Archnemesis</h1>

    <div class="card">
      <div id="status">Ładowanie danych...</div>

      <div id="userBox" class="user-box" style="display:none;">
        <img id="avatar" class="avatar" src="" alt="avatar">
        <div class="username" id="username"></div>
      </div>

      <div class="roles-title">Twoje rangi:</div>
      <div id="roles"></div>
    </div>

  </div>

  <script>
    const ROLE_DEFS = {
      "1532749280220024842": { name: "Premium", color: "#FFD700", hidden: false },
      "1536693194744660039": { name: "Beta", color: "#C060FF", hidden: false },
      "1534495312377417868": { name: "Booster", color: "#8A2BE2", hidden: false },

      "1534495410566201427": { name: "Trusted", color: "#FFCCCC", hidden: true },
      "1532716147093274685": { name: "Moderator", color: "#4FC3F7", hidden: true },
      "1536692816284094554": { name: "Admin", color: "#FF6666", hidden: true },
      "1536692884928208936": { name: "HeadAdmin", color: "#FF0000", hidden: true },
      "1532711838264066129": { name: "Co-Owner", color: "#FF0000", hidden: true },

      "1529827656428818492": { name: "Owner", color: "#FF0000", hidden: true },
      "1534494523768569897": { name: "Owner Bot", color: "#8B0000", hidden: true }
    };

    const statusEl = document.getElementById("status");
    const rolesEl = document.getElementById("roles");
    const userBox = document.getElementById("userBox");
    const avatarEl = document.getElementById("avatar");
    const usernameEl = document.getElementById("username");

    // NOWE — token z cookie, nie z URL
    fetch("/api/user")
      .then(r => r.json())
      .then(data => {
        if (data.error) {
          statusEl.innerHTML = '<span class="error">Błąd: ' + data.error + '</span>';
          return;
        }

        userBox.style.display = "flex";
        avatarEl.src = `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png?size=256`;
        usernameEl.textContent = `${data.username}#${data.discriminator}`;

        statusEl.innerHTML = "Dane załadowane.";

        const roleIds = Array.isArray(data.roles) ? data.roles : [];

        if (!roleIds.length) {
          rolesEl.innerHTML = '<div class="error">Brak ról lub bot nie widzi członków serwera.</div>';
          return;
        }

        rolesEl.innerHTML = "";

        roleIds.forEach(roleId => {
          const def = ROLE_DEFS[roleId];
          if (!def || def.hidden) return;

          const el = document.createElement("span");
          el.className = "role";
          el.textContent = def.name;
          el.style.background = def.color;
          el.style.color = "#071022";
          rolesEl.appendChild(el);
        });
      })
      .catch(err => {
        console.error(err);
        statusEl.innerHTML = '<span class="error">Błąd ładowania danych.</span>';
      });
  </script>
</body>
</html>

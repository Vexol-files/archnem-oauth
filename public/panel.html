<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Archnem Panel</title>
  <style>
    body { font-family: Inter, system-ui, Arial; padding: 24px; background:#0f172a; color:#e6eef8; }
    .card { background:#0b1220; padding:16px; border-radius:8px; max-width:720px; margin:12px 0; }
    .role { display:inline-block; margin:6px 8px; padding:6px 10px; border-radius:999px; font-weight:600; }
    .error { color:#ffb4b4; }
  </style>
</head>
<body>
  <h1>Panel Archnem</h1>

  <div class="card">
    <div id="status">Ładowanie...</div>
    <div id="roles" style="margin-top:12px"></div>
  </div>

  <script>
    // Lokalna mapa ról dla statycznego panelu
    const ROLE_DEFS = {
      "1532749280220024842": { name: "Premium", color: "#FFD700", hidden: false },
      "1536693194744660039": { name: "Beta", color: "#C060FF", hidden: false },
      "1534495312377417868": { name: "Booster", color: "#8A2BE2", hidden: false },

      "1534495410566201427": { name: "Trusted", color: "#FFCCCC", hidden: true },
      "1532716147093274685": { name: "Moderator", color: "#4FC3F7", hidden: true },
      "1536692816284094554": { name: "Admin", color: "#FF6666", hidden: true },
      "1536692884928208936": { name: "HeadAdmin", color: "#FF0000", hidden: true },
      "1532711838264066129": { name: "Co-Owner", color: "#FF0000", hidden: true },

      "1529827656428818492": { name: "Owner", color: "#FF0000", hidden: true },
      "1534494523768569897": { name: "Owner Bot", color: "#8B0000", hidden: true }
    };

    const statusEl = document.getElementById("status");
    const rolesEl = document.getElementById("roles");

    const url = new URL(window.location.href);
    const token = url.searchParams.get("access_token");
    const error = url.searchParams.get("error");

    if (error) {
      statusEl.innerHTML = '<span class="error">Błąd: ' + error + '</span>';
    }

    if (!token) {
      statusEl.innerHTML = 'Brak tokena. <a href="/login.html">Zaloguj się przez Discord</a>';
      rolesEl.innerHTML = '';
    } else {
      statusEl.innerText = 'Pobieram dane użytkownika...';
      fetch(`/api/user?access_token=${encodeURIComponent(token)}`)
        .then(r => r.json())
        .then(data => {
          if (data.error) {
            statusEl.innerHTML = '<span class="error">Błąd: ' + (data.error || 'nieznany') + '</span>';
            return;
          }

          statusEl.innerText = `Zalogowany jako ${data.username}#${data.discriminator}`;

          const roleIds = Array.isArray(data.roles) ? data.roles : [];
          if (!roleIds.length) {
            rolesEl.innerHTML = '<div class="error">Brak ról lub bot nie widzi członków serwera.</div>';
            return;
          }

          rolesEl.innerHTML = '';
          roleIds.forEach(roleId => {
            const def = ROLE_DEFS[roleId];
            if (!def) return;
            if (def.hidden) return; // ukryte role nie są pokazywane
            const el = document.createElement('span');
            el.className = 'role';
            el.textContent = def.name;
            el.style.background = def.color;
            el.style.color = '#071022';
            rolesEl.appendChild(el);
          });
        })
        .catch(err => {
          console.error(err);
          statusEl.innerHTML = '<span class="error">Błąd ładowania danych.</span>';
        });
    }
  </script>
</body>
</html>

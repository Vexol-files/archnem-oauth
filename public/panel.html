<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Archnem Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b1220;
      --panel:#0f1724;
      --card:#111827;
      --muted:#9aa6b2;
      --accent:#7c3aed;
      --radius:12px;
    }

    body{
      margin:0;
      font-family:Inter,system-ui;
      background:var(--bg);
      color:#e6eef8;
      display:flex;
      height:100vh;
      overflow:hidden;
    }

    /* SIDEBAR */
    .sidebar{
      width:220px;
      background:#0d1525;
      border-right:1px solid rgba(255,255,255,0.05);
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .logo{
      font-size:20px;
      font-weight:700;
      color:white;
      padding:10px 0;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .nav-item{
      padding:10px 12px;
      border-radius:8px;
      cursor:pointer;
      color:#cfd8e3;
      transition:all .15s ease;
    }

    .nav-item:hover{
      background:rgba(255,255,255,0.05);
    }

    .nav-item.active{
      background:rgba(255,255,255,0.08);
      color:white;
      font-weight:600;
    }

    /* MAIN CONTENT */
    .main{
      flex:1;
      overflow-y:auto;
      padding:30px;
    }

    .card{
      background:var(--card);
      padding:20px;
      border-radius:var(--radius);
      margin-bottom:20px;
      box-shadow:0 8px 24px rgba(0,0,0,0.4);
    }

    .section-title{
      font-size:18px;
      font-weight:700;
      margin-bottom:10px;
    }

    .small{
      font-size:13px;
      color:var(--muted);
    }

    input,textarea,select{
      width:100%;
      padding:10px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.08);
      background:#0f1724;
      color:white;
      margin-top:6px;
    }

    textarea{
      min-height:100px;
    }

    .btn{
      padding:10px 14px;
      border-radius:8px;
      background:#1f2937;
      border:1px solid rgba(255,255,255,0.08);
      color:white;
      cursor:pointer;
      transition:all .15s ease;
      margin-top:10px;
    }

    .btn:hover{
      background:#374151;
    }

    .btn.primary{
      background:linear-gradient(90deg,#6b21a8,#06b6d4);
      border:0;
    }

    .roles{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }

    .pill{
      padding:6px 10px;
      border-radius:999px;
      font-weight:600;
      border:1px solid rgba(255,255,255,0.08);
    }

    .pill.no-color{
      background:rgba(255,255,255,0.05);
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">Archnem Panel</div>

    <div class="nav">
      <div class="nav-item active" data-tab="info">Informations</div>
      <div class="nav-item" data-tab="bot">Bot Console</div>
    </div>

    <button id="logout" class="btn" style="margin-top:auto;">Logout</button>
  </div>

  <!-- MAIN -->
  <div class="main">
    
    <!-- INFO -->
    <div id="info" class="tabPanel">
      <div class="card">
        <div class="section-title">Account Informations</div>

        <div class="small"><strong>ID:</strong> <span id="userId">—</span></div>
        <div class="small"><strong>Username:</strong> <span id="usernameLine">—</span></div>
        <div class="small"><strong>Email:</strong> <span id="accountEmail">—</span></div>
        <div class="small"><strong>Highest role:</strong> <span id="highestRole">—</span></div>

        <div class="section-title" style="margin-top:20px;">Roles</div>
        <div id="roles" class="roles"></div>
      </div>
    </div>

    <!-- BOT -->
    <div id="bot" class="tabPanel" style="display:none">
      <div class="card">
        <div class="section-title">Bot Console</div>
        <div class="small">Send messages and perform actions using the bot.</div>

        <div style="margin-top:12px">
          <div class="small"><strong>Channel ID</strong></div>
          <input id="channelSelect" placeholder="Channel ID">
        </div>

        <div style="margin-top:12px">
          <div class="small"><strong>Message</strong></div>
          <textarea id="messageContent" placeholder="Message content"></textarea>
        </div>

        <div style="margin-top:12px">
          <label><input type="checkbox" id="allowEveryone"> Allow @everyone</label>
        </div>

        <div style="margin-top:12px">
          <div class="small"><strong>Mention Users (IDs)</strong></div>
          <input id="mentionUsersInput" placeholder="Comma separated IDs">
        </div>

        <button id="sendMsg" class="btn primary">Send as Bot</button>
        <div id="sendResult" class="small" style="margin-top:8px"></div>

        <div style="margin-top:20px">
          <div class="small"><strong>Member actions</strong></div>
          <input id="targetUser" placeholder="User ID" style="margin-top:8px">
          <button id="banBtn" class="btn">Ban</button>
          <button id="kickBtn" class="btn">Kick</button>
          <div id="memberResult" class="small" style="margin-top:8px"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Sidebar switching
    document.querySelectorAll('.nav-item').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');

        const tab = btn.dataset.tab;
        document.querySelectorAll('.tabPanel').forEach(p=>p.style.display='none');
        document.getElementById(tab).style.display='block';
      });
    });

    // Safe fetch
    async function safeFetchJson(url, opts){
      const res = await fetch(url, opts);
      const text = await res.text();
      try{
        const data = text ? JSON.parse(text) : {};
        if(!res.ok){
          throw new Error(data.error || `HTTP ${res.status}`);
        }
        return data;
      }catch(e){
        throw new Error(`Server error: ${text.slice(0,200)}`);
      }
    }

    // Load user
    async function loadUser(){
      try{
        const data = await safeFetchJson('/api/user', { credentials:'same-origin' });

        document.getElementById('userId').textContent = data.id;
        document.getElementById('usernameLine').textContent = `${data.username}#${data.discriminator}`;
        document.getElementById('accountEmail').textContent = data.email || '—';

        const rolesEl = document.getElementById('roles');
        rolesEl.innerHTML = '';

        const roles = data.roles || [];
        const highest = roles.length ? roles[0] : null;
        document.getElementById('highestRole').textContent = highest ? highest.name : '—';

        roles.forEach(r=>{
          const pill = document.createElement('div');
          pill.className = 'pill';
          pill.textContent = r.name;
          if(!r.color) pill.classList.add('no-color');
          else{
            pill.style.background = r.color;
            pill.style.color = '#000';
          }
          rolesEl.appendChild(pill);
        });

      }catch(err){
        console.error(err);
      }
    }

    // Bot actions
    document.getElementById('sendMsg').addEventListener('click', async ()=>{
      const channelId = document.getElementById('channelSelect').value.trim();
      const content = document.getElementById('messageContent').value.trim();
      const allowEveryone = document.getElementById('allowEveryone').checked;
      const mentionUsersRaw = document.getElementById('mentionUsersInput').value.trim();
      const mentionUsers = mentionUsersRaw ? mentionUsersRaw.split(',').map(s=>s.trim()) : [];

      const out = document.getElementById('sendResult');
      out.textContent = 'Sending...';

      try{
        await safeFetchJson('/api/bot/sendMessage',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ channelId, content, allowEveryone, mentionUsers })
        });
        out.textContent = 'Message sent';
      }catch(err){
        out.textContent = 'Error: ' + err.message;
      }
    });

    document.getElementById('banBtn').addEventListener('click', async ()=>{
      const userId = document.getElementById('targetUser').value.trim();
      const out = document.getElementById('memberResult');
      out.textContent = 'Processing...';
      try{
        await safeFetchJson('/api/bot/ban',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ userId })
        });
        out.textContent = 'User banned';
      }catch(err){
        out.textContent = 'Error: ' + err.message;
      }
    });

    document.getElementById('kickBtn').addEventListener('click', async ()=>{
      const userId = document.getElementById('targetUser').value.trim();
      const out = document.getElementById('memberResult');
      out.textContent = 'Processing...';
      try{
        await safeFetchJson('/api/bot/kick',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ userId })
        });
        out.textContent = 'User kicked';
      }catch(err){
        out.textContent = 'Error: ' + err.message;
      }
    });

    document.getElementById('logout').addEventListener('click', ()=>{
      window.location.href = '/api/logout';
    });

    loadUser();
  </script>

</body>
</html>

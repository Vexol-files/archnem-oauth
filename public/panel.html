<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Archnem Panel</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  body {
    margin:0;
    background:#000;
    color:#fff;
    font-family:Inter, sans-serif;
    display:flex;
    height:100vh;
    overflow:hidden;
  }

  .sidebar {
    width:230px;
    background:#0a0a0a;
    border-right:1px solid #111;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  .logo {
    font-size:22px;
    font-weight:800;
    color:#fff;
  }

  .nav-item {
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    color:#ccc;
    transition:0.2s;
  }

  .nav-item:hover {
    background:#111;
    color:#fff;
  }

  .nav-item.active {
    background:#222;
    color:#fff;
    font-weight:600;
  }

  .main {
    flex:1;
    overflow-y:auto;
    padding:30px;
  }

  .card {
    background:#0a0a0a;
    padding:30px;
    border-radius:16px;
    box-shadow:0 0 40px rgba(255,255,255,0.05);
    animation:fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity:0; transform:translateY(10px); }
    to { opacity:1; transform:translateY(0); }
  }

  .pill {
    padding:6px 12px;
    border-radius:999px;
    font-weight:600;
    border:1px solid #333;
    background:#111;
    color:#fff;
  }

  .roles {
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }

  select, input, textarea {
    width:100%;
    padding:10px;
    border-radius:8px;
    background:#111;
    border:1px solid #333;
    color:#fff;
  }

  .btn {
    padding:10px 14px;
    border-radius:8px;
    background:#222;
    border:1px solid #333;
    color:#fff;
    cursor:pointer;
    transition:0.2s;
  }

  .btn:hover {
    background:#333;
  }

  .btn.primary {
    background:#6b21a8;
    border:none;
  }

  .badge {
    width:32px;
    height:32px;
    filter:drop-shadow(0 0 6px rgba(255,255,255,0.3));
  }
</style>
</head>

<body>

<div class="sidebar">
  <div class="logo">Archnem Panel</div>

  <div class="nav-item active" data-tab="info">Informations</div>
  <div class="nav-item" id="botTab" data-tab="bot" style="display:none;">Bot Console</div>

  <button id="logout" class="btn" style="margin-top:auto;">Logout</button>
</div>

<div class="main">

  <!-- INFO -->
  <div id="info" class="tabPanel">
    <div class="card">

      <div style="display:flex; align-items:center; gap:25px;">
        <img id="avatarImg" src="" style="width:110px; height:110px; border-radius:50%; object-fit:cover; box-shadow:0 0 20px rgba(255,255,255,0.15);">

        <div>
          <div id="bigNick" style="font-size:40px; font-weight:800; letter-spacing:-1px;">Loading...</div>
          <div id="smallUser" style="font-size:18px; opacity:0.8; margin-top:4px;">—</div>

          <div id="badges" style="display:flex; gap:8px; margin-top:10px;"></div>

          <img id="ownerIcon"
               src="https://tr.rbxcdn.com/180DAY-9d9e2b179cfa38edb50110f4c7d94e1b/420/420/BackAccessory/Webp/noFilter"
               style="width:32px; height:32px; display:none; margin-top:10px;">
        </div>
      </div>

      <div style="margin-top:30px;">
        <div><strong>ID:</strong> <span id="userId">—</span></div>
        <div><strong>Email:</strong> <span id="accountEmail">—</span></div>
        <div><strong>Highest role:</strong> <span id="highestRole">—</span></div>
      </div>

      <div style="margin-top:20px; font-size:20px; font-weight:700;">Roles</div>
      <div id="roles" class="roles"></div>

    </div>
  </div>

  <!-- BOT -->
  <div id="bot" class="tabPanel" style="display:none;">
    <div class="card">

      <div style="font-size:22px; font-weight:700;">Bot Console</div>

      <div style="margin-top:20px;">
        <strong>Channel</strong>
        <select id="channelSelect"></select>
      </div>

      <div style="margin-top:20px; display:flex; gap:10px;">
        <label><input type="checkbox" id="mentionEveryone"> @everyone</label>
        <label><input type="checkbox" id="mentionHere"> @here</label>
      </div>

      <div style="margin-top:10px;">
        <strong>Mention user ID</strong>
        <input id="mentionUserId" placeholder="optional">
      </div>

      <div style="margin-top:10px;">
        <strong>Mention role ID</strong>
        <input id="mentionRoleId" placeholder="optional">
      </div>

      <div style="margin-top:20px;">
        <strong>Message</strong>
        <textarea id="messageContent"></textarea>
      </div>

      <button id="sendMsg" class="btn primary" style="margin-top:10px;">Send as Bot</button>
      <div id="sendResult" style="margin-top:10px; opacity:0.8;"></div>

    </div>
  </div>

</div>

<script>
const BADGE_ICONS = {
  HypeSquadBravery: "https://cdn.discordapp.com/badge-icons/1.png",
  HypeSquadBrilliance: "https://cdn.discordapp.com/badge-icons/2.png",
  HypeSquadBalance: "https://cdn.discordapp.com/badge-icons/3.png",
  BugHunterLevel1: "https://cdn.discordapp.com/badge-icons/bug1.png",
  BugHunterLevel2: "https://cdn.discordapp.com/badge-icons/bug2.png",
  EarlySupporter: "https://cdn.discordapp.com/badge-icons/es.png",
  VerifiedDeveloper: "https://cdn.discordapp.com/badge-icons/vd.png",
  ActiveDeveloper: "https://cdn.discordapp.com/badge-icons/ad.png",
  Nitro: "https://cdn.discordapp.com/badge-icons/nitro.png",
  Staff: "https://cdn.discordapp.com/badge-icons/staff.png",
  Partner: "https://cdn.discordapp.com/badge-icons/partner.png"
};

async function safeFetchJson(url, opts) {
  const res = await fetch(url, opts);
  const text = await res.text();
  const data = text ? JSON.parse(text) : {};
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

async function loadUser() {
  const data = await safeFetchJson('/api/user', { credentials:'same-origin' });

  const avatarUrl = data.avatar 
    ? `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png?size=256`
    : `https://cdn.discordapp.com/embed/avatars/0.png`;

  document.getElementById('avatarImg').src = avatarUrl;

  const highest = data.roles.length ? data.roles[0] : null;
  const bigNick = document.getElementById('bigNick');
  bigNick.textContent = data.username;

  if (highest && highest.color) {
    bigNick.style.color = highest.color;
    bigNick.style.textShadow = `0 0 15px ${highest.color}55`;
  }

  document.getElementById('smallUser').textContent =
    `${data.username}#${data.discriminator}`;

  if (data.isOwnerRole) {
    document.getElementById('ownerIcon').style.display = "block";
    document.getElementById('botTab').style.display = "block";
  }

  const badgesEl = document.getElementById('badges');
  badgesEl.innerHTML = "";
  if (data.badges) {
    data.badges.forEach(b => {
      if (BADGE_ICONS[b]) {
        const img = document.createElement('img');
        img.src = BADGE_ICONS[b];
        img.className = "badge";
        badgesEl.appendChild(img);
      }
    });
  }

  const rolesEl = document.getElementById('roles');
  rolesEl.innerHTML = '';
  data.roles.forEach(r => {
    const pill = document.createElement('div');
    pill.className = 'pill';
    pill.textContent = r.name;
    if (r.color) {
      pill.style.background = r.color;
      pill.style.color = "#000";
    }
    rolesEl.appendChild(pill);
  });

  document.getElementById('userId').textContent = data.id;
  document.getElementById('accountEmail').textContent = data.email || '—';
  document.getElementById('highestRole').textContent = highest ? highest.name : '—';
}

async function loadChannels() {
  const data = await safeFetchJson('/api/bot/channels', { credentials:'same-origin' });

  const select = document.getElementById('channelSelect');
  select.innerHTML = '';

  data.channels.forEach(ch => {
    const opt = document.createElement('option');
    opt.value = ch.id;
    opt.textContent = `${ch.typeName} — #${ch.name}`;
    select.appendChild(opt);
  });
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const tab = btn.dataset.tab;
    document.querySelectorAll('.tabPanel').forEach(p => p.style.display='none');
    document.getElementById(tab).style.display='block';
  });
});

document.getElementById('logout').addEventListener('click', () => {
  window.location.href = '/api/logout';
});

document.getElementById('sendMsg').addEventListener('click', async () => {
  try {
    const channelId = document.getElementById('channelSelect').value;
    const content = document.getElementById('messageContent').value;
    const mentionEveryone = document.getElementById('mentionEveryone').checked;
    const mentionHere = document.getElementById('mentionHere').checked;
    const mentionUserId = document.getElementById('mentionUserId').value || null;
    const mentionRoleId = document.getElementById('mentionRoleId').value || null;

    const body = {
      channelId,
      content,
      mentionEveryone,
      mentionHere,
      mentionUserId,
      mentionRoleId
    };

    const res = await safeFetchJson('/api/bot/sendMessage', {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      credentials:"same-origin",
      body:JSON.stringify(body)
    });

    document.getElementById('sendResult').textContent =
      `Sent message ID: ${res.messageId}`;
  } catch (err) {
    document.getElementById('sendResult').textContent = `Error: ${err.message}`;
  }
});

loadUser();
loadChannels();
</script>

</body>
</html>

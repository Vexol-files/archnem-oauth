<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Archnemesis — Panel (Diagnostics)</title>
  <style>
    :root{ --bg:#0b1220; --card:rgba(255,255,255,0.06); --text:#eaeaea; --accent:#d28cff; --muted:#9aa6b2; }
    [data-theme="light"]{ --bg:#f6f7fb; --card:rgba(10,10,12,0.04); --text:#0b1220; --accent:#6b21a8; --muted:#4b5563; }
    body{ margin:0; font-family:Inter,Segoe UI,Arial; background:linear-gradient(135deg,var(--bg),#0a0a0a); color:var(--text); padding:28px; transition:all .2s; }
    .container{ max-width:980px; margin:auto; }
    .header{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
    .title{ font-size:22px; color:var(--accent); font-weight:700; }
    .controls{ display:flex; gap:8px; align-items:center; }
    .btn{ background:var(--card); border-radius:8px; padding:8px 12px; color:var(--text); border:1px solid rgba(255,255,255,0.06); cursor:pointer; }
    .card{ background:var(--card); border-radius:12px; padding:16px; backdrop-filter:blur(6px); }
    .row{ display:flex; gap:12px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
    .label{ color:var(--muted); font-size:13px; min-width:120px; }
    pre{ background:rgba(0,0,0,0.25); padding:12px; border-radius:8px; overflow:auto; max-height:360px; }
    .small{ font-size:13px; color:var(--muted); }
    .error{ color:#ff6b6b; }
    footer{ margin-top:18px; color:var(--muted); font-size:13px; text-align:center; }
    input.token { width:420px; padding:8px; border-radius:8px; border:1px solid rgba(255,255,255,0.06); background:transparent; color:var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <div class="title">Archnemesis — Diagnostics</div>
        <div class="small">Flow: OAuth → callback → panel (token in sessionStorage)</div>
      </div>

      <div class="controls">
        <button class="btn" id="theme-toggle">Dark</button>
        <button class="btn" id="logout">Wyloguj</button>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div class="label">Access token</div>
        <input id="tokenInput" class="token" placeholder="Brak tokena" readonly />
        <button class="btn" id="copyToken">Kopiuj</button>
        <button class="btn" id="clearToken">Wyczyść</button>
      </div>

      <div class="row">
        <div class="label">Actions</div>
        <button class="btn" id="runDiag">Run diagnostics</button>
        <button class="btn" id="runDiagNoDebug">Get user (no debug)</button>
        <button class="btn" id="openLogin">Open login</button>
      </div>

      <div class="row">
        <div class="label">Last status</div>
        <div id="statusText" class="small">—</div>
      </div>

      <div style="margin-top:12px;">
        <div class="label">Diagnostics output</div>
        <pre id="output">No diagnostics run yet.</pre>
      </div>
    </div>

    <footer>© Archnemesis</footer>
  </div>

  <script>
    // Theme
    let THEME = localStorage.getItem("archnem_theme") || "dark";
    function applyTheme() {
      document.documentElement.setAttribute("data-theme", THEME === "dark" ? "dark" : "light");
      document.getElementById("theme-toggle").textContent = THEME === "dark" ? "Dark" : "Light";
    }
    document.getElementById("theme-toggle").addEventListener("click", () => {
      THEME = THEME === "dark" ? "light" : "dark";
      localStorage.setItem("archnem_theme", THEME);
      applyTheme();
    });
    applyTheme();

    // Elements
    const tokenInput = document.getElementById("tokenInput");
    const copyBtn = document.getElementById("copyToken");
    const clearBtn = document.getElementById("clearToken");
    const runDiagBtn = document.getElementById("runDiag");
    const runDiagNoDebugBtn = document.getElementById("runDiagNoDebug");
    const outputEl = document.getElementById("output");
    const statusEl = document.getElementById("statusText");
    const logoutBtn = document.getElementById("logout");
    const openLoginBtn = document.getElementById("openLogin");

    // Token handling: copy from URL -> sessionStorage -> remove from URL
    (function handleTokenInUrl() {
      const url = new URL(window.location.href);
      const urlToken = url.searchParams.get("access_token");
      if (urlToken) {
        sessionStorage.setItem("archnem_token", urlToken);
        url.searchParams.delete("access_token");
        window.history.replaceState({}, document.title, url.pathname + url.search);
      }
      const t = sessionStorage.getItem("archnem_token");
      if (t) tokenInput.value = t;
    })();

    copyBtn.addEventListener("click", async () => {
      const t = sessionStorage.getItem("archnem_token") || "";
      if (!t) return alert("Brak tokena");
      await navigator.clipboard.writeText(t);
      statusEl.textContent = "Token skopiowany do schowka";
    });

    clearBtn.addEventListener("click", () => {
      sessionStorage.removeItem("archnem_token");
      tokenInput.value = "";
      statusEl.textContent = "Token usunięty";
      outputEl.textContent = "No diagnostics run yet.";
    });

    logoutBtn.addEventListener("click", () => {
      sessionStorage.removeItem("archnem_token");
      window.location.href = "/api/logout";
    });

    openLoginBtn.addEventListener("click", () => {
      // gotowy link OAuth (zmień client_id jeśli trzeba)
      const link = "https://discord.com/api/oauth2/authorize?response_type=code&client_id=1532718787139207301&scope=identify%20guilds%20email%20guilds.join%20connections%20guilds.members.read&redirect_uri=https%3A%2F%2Farchnem-oauth.vercel.app%2Fapi%2Fcallback&prompt=consent";
      window.location.href = link;
    });

    // Diagnostics call
    async function runDiagnostics(debug = true) {
      const token = sessionStorage.getItem("archnem_token");
      if (!token) {
        statusEl.textContent = "No session. Log in with Discord.";
        outputEl.textContent = "Brak tokena w sessionStorage. Zaloguj się przez Discord (Open login).";
        return;
      }
      tokenInput.value = token;
      statusEl.textContent = "Running diagnostics...";
      outputEl.textContent = "Running...";

      try {
        const url = `/api/user?access_token=${encodeURIComponent(token)}${debug ? "&debug=1" : ""}`;
        const r = await fetch(url);
        const text = await r.text();
        let parsed;
        try { parsed = JSON.parse(text); } catch (e) { parsed = { raw: text }; }

        outputEl.textContent = JSON.stringify({
          httpStatus: r.status,
          body: parsed
        }, null, 2);

        if (r.status >= 400) {
          statusEl.textContent = `Error ${r.status}`;
        } else {
          statusEl.textContent = "OK";
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Network error";
        outputEl.textContent = "Network error: " + (err.message || err);
      }
    }

    runDiagBtn.addEventListener("click", () => runDiagnostics(true));
    runDiagNoDebugBtn.addEventListener("click", () => runDiagnostics(false));

    // Auto-run diagnostics if token present (non-blocking)
    if (sessionStorage.getItem("archnem_token")) {
      // small delay to let UI render
      setTimeout(() => runDiagnostics(true), 300);
    }
  </script>
</body>
</html>

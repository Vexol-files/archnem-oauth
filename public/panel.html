<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Archnemesis Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --bg: #05060a;
    --card: #0b0f1a;
    --accent: #7b3fff;
    --accent-soft: rgba(123,63,255,0.35);
    --text-main: #f5f5ff;
    --text-muted: #9aa0c2;
}

.light {
    --bg: #f5f5ff;
    --card: #ffffff;
    --accent: #7b3fff;
    --accent-soft: rgba(123,63,255,0.25);
    --text-main: #0b0f1a;
    --text-muted: #444;
}

body {
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text-main);
    font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.topbar {
    display:flex;
    justify-content:space-between;
    padding:20px;
}

.user-info {
    display:flex;
    align-items:center;
    gap:12px;
}

.user-info img {
    width:42px;
    height:42px;
    border-radius:50%;
}

.roles {
    display:flex;
    gap:8px;
    align-items:center;
}

.role {
    padding:6px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:6px;
}

.circle {
    width:10px;
    height:10px;
    border-radius:50%;
}

/* Kolory rolek */
.premium { background:#ffd500; }
.beta { background:#ffe766; }
.booster { background:#d26bff; }
.trusted { background:#ffb3b3; }
.moderator { background:#6ecbff; }
.admin { background:#ff6b6b; }
.headadmin { background:#ff3b3b; }
.coowner { background:#ff3b3b; }
.owner { background:#ff3b3b; }
.ownerdark { background:#b30000; }

.panel {
    max-width:520px;
    margin:40px auto;
    background:var(--card);
    padding:28px;
    border-radius:24px;
    box-shadow:0 0 40px rgba(0,0,0,0.7), 0 0 60px var(--accent-soft);
    border:1px solid rgba(255,255,255,0.06);
}

.logout-btn {
    margin-top:20px;
    padding:10px 16px;
    border-radius:999px;
    border:none;
    background:#7b3fff;
    color:#fff;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    box-shadow:0 0 20px rgba(123,63,255,0.6);
}

.mode-btn {
    padding:8px 14px;
    border-radius:999px;
    border:none;
    background:#333;
    color:#fff;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
    <div class="user-info" id="user-info"></div>
    <div class="roles" id="roles"></div>
</div>

<div class="panel">
    <h2>Archnemesis Panel</h2>
    <p id="status">Ładuję dane...</p>

    <button class="logout-btn" onclick="logout()">Wyloguj i wróć na archnem.xo.je</button>
    <button class="mode-btn" onclick="toggleMode()">Tryb jasny/ciemny</button>
</div>

<script>
function toggleMode() {
    document.body.classList.toggle("light");
}

function logout() {
    document.cookie = "archnem_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    window.location.href = "https://archnem.xo.je/";
}

async function loadUser() {
    const statusEl = document.getElementById("status");
    const userInfo = document.getElementById("user-info");
    const rolesEl = document.getElementById("roles");

    try {
        const res = await fetch("/api/user");
        if (!res.ok) {
            statusEl.innerHTML = "Błąd ładowania danych (" + res.status + ")";
            return;
        }

        const data = await res.json();

        // avatar
        const avatarURL = data.avatar
            ? `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png`
            : "https://cdn.discordapp.com/embed/avatars/0.png";

        userInfo.innerHTML = `
            <img src="${avatarURL}">
            <div>${data.username}#${data.discriminator}</div>
        `;

        statusEl.innerHTML = "Zalogowano.";

        // role IDs
        const roles = {
            "1532749280220024842": {name:"Premium", class:"premium"},
            "1536693194744660039": {name:"Beta", class:"beta"},
            "1534495312377417868": {name:"Booster", class:"booster"},
            "1534495410566201427": {name:"Trusted", class:"trusted"},
            "1532716147093274685": {name:"Moderator", class:"moderator"},
            "1536692816284094554": {name:"Admin", class:"admin"},
            "1536692884928208936": {name:"HeadAdmin", class:"headadmin"},
            "1532711838264066129": {name:"Co-Owner", class:"coowner"},
            "1529827656428818492": {name:"Owner", class:"owner"},
            "1534494523768569897": {name:"Owner Dark", class:"ownerdark"}
        };

        // tu pobieramy role z Discorda
        const guildRes = await fetch(`https://discord.com/api/users/@me/guilds`, {
            headers: { Authorization: `Bearer ${data.token}` }
        });

        // UWAGA: jeśli nie masz scope "guilds" → role musimy pobierać z BOT API
        // więc tu zrobimy placeholder:
        const userRoles = data.roles || [];

        // wyświetlanie rolek
        for (const roleId of userRoles) {
            if (roles[roleId]) {
                const r = roles[roleId];
                rolesEl.innerHTML += `
                    <div class="role">
                        <div class="circle ${r.class}"></div>
                        ${r.name}
                    </div>
                `;
            }
        }

    } catch (e) {
        statusEl.innerHTML = "Błąd ładowania danych (exception)";
        console.log(e);
    }
}

loadUser();
</script>

</body>
</html>
